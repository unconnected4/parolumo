name: web

on:
  pull_request:
    paths: ["web/**", "docs/api/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", "docs/api/**", ".github/workflows/web.yml"]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - id: scaffold
        name: Check web is scaffolded
        working-directory: .
        run: |
          if [ -f web/package.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::web not scaffolded yet, skipping"; fi

      - if: steps.scaffold.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - if: steps.scaffold.outputs.ready == 'true'
        run: npm ci

      - if: steps.scaffold.outputs.ready == 'true'
        name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - if: steps.scaffold.outputs.ready == 'true'
        name: Unit tests
        run: npm test

      - if: steps.scaffold.outputs.ready == 'true'
        name: API client is up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api || {
            echo "::error::web/src/api is stale. Run npm run gen:api"; exit 1; }

      - if: steps.scaffold.outputs.ready == 'true'
        name: Build
        run: npm run build

      - if: steps.scaffold.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
